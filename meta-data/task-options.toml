# Task 选项目录。修改后无需重启；下次打开编辑、保存或创建重新读取。
# id 为 Task 保存的稳定标识；label 只影响显示。不要把映射副本写入 Task。
[[agents]]
id = 'omp'
label = 'oh-my-pi'
[[agents]]
id = 'pi'
label = 'Pi'

[[models]]
id = 'default'
label = 'Default Model'
# default 不允许 provider_model/thinking 覆盖。
[[models]]
id = 'gpt-6.1-sol'
label = 'GPT-6.1-Sol'
provider_model = 'openai-codex/gpt-6.1-sol'
# 能力来自具体模型，不是 CLI 接受的所有级别。
thinking = { omp = ['low', 'medium', 'high', 'xhigh', 'max'], pi = ['minimal', 'low', 'medium', 'high', 'xhigh', 'max'] }
[[models]]
id = 'gpt-6-luna'
label = 'GPT-6-Luna'
provider_model = 'openai-codex/gpt-6-luna'
thinking = { omp = ['low', 'medium', 'high', 'xhigh', 'max'], pi = ['off', 'minimal', 'low', 'medium', 'high', 'xhigh', 'max'] }
[[models]]
id = 'gpt-6-astra'
label = 'GPT-6-Astra'
provider_model = 'openai-codex/gpt-6-astra'
thinking = { omp = ['low', 'medium', 'high', 'xhigh', 'max'], pi = ['minimal', 'low', 'medium', 'high', 'xhigh', 'max'] }
[[models]]
id = 'deepseek-flash'
label = 'DeepSeek-Flash'
provider_model = 'deepseek/deepseek-flash'
thinking = { omp = ['low', 'high', 'max'], pi = ['off', 'low', 'high', 'max'] }

[[skills]]
id = 'grill-with-docs'
label = '/grill-with-docs'
native_name = 'grill-with-docs'
[[skills]]
id = 'teach'
label = '/teach'
native_name = 'teach'
[[skills]]
id = 'code-review'
label = '/code-review'
native_name = 'code-review'
[[skills]]
id = 'wayfinder'
label = '/wayfinder'
native_name = 'wayfinder'
[[skills]]
id = 'writing-for-agents'
label = '/writing-for-agents'
native_name = 'writing-for-agents'
[[skills]]
id = 'improve-codebase-architecture'
label = '/improve-codebase-architecture'
native_name = 'improve-codebase-architecture'

# 相同显示名称在两个 Agent 下是不同稳定标识，不隐式继承。
# --no-extensions 会关闭默认发现，因此显式保留 Herdr 官方状态与会话引用上报。
[[extensions]]
id = 'omp-herdr-agent-state'
label = 'herdr-agent-state'
agent = 'omp'
kind = 'fixed'
entrypoint = 'C:\Users\hugos\.omp\agent\extensions\herdr-omp-agent-state.ts'
[[extensions]]
id = 'omp-model-cost'
label = 'model-cost'
agent = 'omp'
kind = 'fixed'
entrypoint = 'E:\Developer\myhub\my-agent-toolkit\entrypoints\omp\model-cost.ts'
# Stable manager-chat/node-chat IDs have code-owned execution-role applicability.
# Node roles load only for workflow execution, never standalone normal Tasks.
# Entrypoints remain configurable; saving a Task does not verify native loading.
[[extensions]]
id = 'omp-manager-chat'
label = 'manager-chat'
agent = 'omp'
kind = 'fixed'
entrypoint = 'E:\Developer\myhub\my-agent-toolkit\entrypoints\omp-auto\manager-chat.ts'
