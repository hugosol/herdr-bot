# Bot 模板选项目录。修改后无需重启；下次打开编辑、保存或创建重新读取。
# id 为模板保存的稳定标识；label 只影响显示。不要把映射副本写入模板。
[[agents]]
id = 'omp'
label = 'OMP'
[[agents]]
id = 'pi'
label = 'Pi'

[[models]]
id = 'default'
label = '沿用 Agent 默认值'
# default 不允许 provider_model/thinking 覆盖。
[[models]]
id = 'gpt-6.1-sol'
label = 'gpt-6.1-sol'
provider_model = 'openai-codex/gpt-6.1-sol'
# 能力来自具体模型，不是 CLI 接受的所有级别。
thinking = { omp = ['low', 'medium', 'high', 'xhigh', 'max'], pi = ['minimal', 'low', 'medium', 'high', 'xhigh', 'max'] }
[[models]]
id = 'deepseek-flash'
label = 'deepseek-flash'
provider_model = 'deepseek/deepseek-flash'
thinking = { omp = ['low', 'high', 'max'], pi = ['off', 'low', 'high', 'max'] }

[[skills]]
id = 'teach'
label = '/teach'
native_name = 'teach'
[[skills]]
id = 'code-review'
label = '/code-review'
native_name = 'code-review'

# 相同显示名称在两个 Agent 下是不同稳定标识，不隐式继承。
[[extensions]]
id = 'omp-model-cost'
label = 'model-cost'
agent = 'omp'
kind = 'fixed'
entrypoint = 'E:\Developer\myhub\my-agent-toolkit\entrypoints\omp\model-cost.ts'
[[extensions]]
id = 'omp-codebase-tools'
label = 'codebase-tools'
agent = 'omp'
kind = 'optional'
entrypoint = 'E:\Developer\myhub\my-agent-toolkit\entrypoints\omp-auto\codebase-tools.ts'
[[extensions]]
id = 'omp-connect-bot'
label = 'connect-bot'
agent = 'omp'
kind = 'optional'
entrypoint = 'E:\Developer\myhub\my-agent-toolkit\entrypoints\omp-auto\connect-bot.ts'
[[extensions]]
id = 'pi-model-cost'
label = 'model-cost'
agent = 'pi'
kind = 'fixed'
entrypoint = 'E:\Developer\myhub\my-agent-toolkit\entrypoints\pi\model-cost.ts'
[[extensions]]
id = 'pi-codebase-tools'
label = 'codebase-tools'
agent = 'pi'
kind = 'optional'
entrypoint = 'E:\Developer\myhub\my-agent-toolkit\entrypoints\pi-auto\codebase-tools.ts'
