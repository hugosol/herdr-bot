[package]
name = "omp-bot"
version = "0.1.0"
edition = "2024"
publish = false
description = "omp-bot 主界面后端：Axum 服务，提供打包页面与固定脚本操作"

[dependencies]
anyhow = "1"
axum = "0.8"
# 只读长连接的帧流用 `futures_util::stream::unfold` 组装；与 axum 自身的用法一致（同一份已在依赖图里
# 的版本，不开默认特性，不新增任何 crate）。
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
if-addrs = "0.15"
mdns-sd = "0.21"
# 真实文件系统事件监听：监听库只在本模块使用，事件仍然经公开 SSE 通知页面重新读取。
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs"] }

# 关机动作是 Windows 专用的：Win32 绑定只在目标平台引入，非 Windows 目标不解析也不链接它。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }
